[package]
name = "theseus_gui"
# The actual version is set by the theseus-build workflow on tagging
version = "1.0.0-local"
edition.workspace = true
description = "Packrinth — an AI-powered Minecraft modpack maker based on the Modrinth App"
repository = "https://github.com/Helio-RC/Packrinth"
license = "GPL-3.0-only"

[dependencies]
ammonia = "4"
anthropic-sdk-rust = "0.1.1"
async-openai = { version = "0.41.3", features = ["chat-completion"] }
async-trait = { workspace = true }
async_zip = { workspace = true, features = ["deflate", "tokio", "tokio-fs"] }
chrono = { workspace = true }
daedalus = { workspace = true }
dashmap = { workspace = true }
either = { workspace = true }
enumset = { workspace = true, features = ["serde"] }
futures-util = { workspace = true }
git2 = { version = "0.20", features = ["vendored-libgit2"] }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
keyring = "3"
native-dialog = { workspace = true }
notify = { workspace = true }
paste = { workspace = true }
path-util = { workspace = true }
pulldown-cmark = "0.13"
reqwest = { workspace = true, features = ["json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true }
tantivy = "0.26"
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-http = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-store = "2"
tauri-plugin-updater = { workspace = true }
tauri-plugin-window-state = { workspace = true }
theseus = { workspace = true, features = ["tauri"] }
thiserror = { workspace = true }
# === AI-WORKSHOP START ===
# tokio 行重写于此：追加 "full" features（features 是叠加的，不影响其他 crate 依赖的 "time"）
tokio = { workspace = true, features = ["full", "time"] }
toml = { workspace = true }
# === AI-WORKSHOP END ===
tracing = { workspace = true }
tracing-error = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4"] }

[dependencies.tauri]
workspace = true
features = ["devtools", "macos-private-api", "protocol-asset"]

[build-dependencies]
tauri-build = { workspace = true, features = ["codegen"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# anthropic-sdk-rust 的 reqwest(默认特性) 在 mac 走 native-tls/openssl；
# vendored 让 openssl-sys 源码编译，避免依赖 brew 安装（universal 构建安全）。
openssl = { version = "0.10", features = ["vendored"] }

[target."cfg(windows)".dependencies]
[target."cfg(windows)".dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]
export-app-events = ["theseus/export-ts"]
updater = []

[lints]
workspace = true
